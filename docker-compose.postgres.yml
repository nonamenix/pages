services:
  strapi:
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${DATABASE_HOST:-shared-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: pages_live4dev
      DATABASE_USERNAME: pages_live4dev_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required for PostgreSQL production}
      DATABASE_SCHEMA: public
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "5"
      DATABASE_CONNECTION_TIMEOUT: "60000"
    networks:
      - default
      - strapi-database
    volumes: !override
      - strapi_uploads:/opt/app/public/uploads

networks:
  strapi-database:
    name: strapi-database
    external: true
